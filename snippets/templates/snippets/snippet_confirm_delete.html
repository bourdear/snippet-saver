{% extends 'base.html' %}

{% block title %}Delete Snippet | Snippet Saver{% endblock %}

{% block content %}
  <h1>Delete Snippet</h1>
  <p>Are you sure you want to delete "{{ snippet.title }}"? This can't be undone.</p>
  <form method="post" class="actions">
    {% csrf_token %}
    <button type="submit">Yes, delete it</button>
    <a href="{{ snippet.get_absolute_url }}">Cancel</a>
  </form>
{% endblock %}
