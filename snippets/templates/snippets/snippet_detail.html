{% extends 'base.html' %}

{% block title %}{{ snippet.title }} | Snippet Saver{% endblock %}

{% block content %}
  <h1>{{ snippet.title }}</h1>
  <p class="meta">{{ snippet.get_language_display }} · {{ snippet.created_at|date:"M j, Y" }}</p>
  <pre><code>{{ snippet.code }}</code></pre>
{% endblock %}
