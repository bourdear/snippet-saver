services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-snippet_saver}
      POSTGRES_USER: ${POSTGRES_USER:-snippet_saver}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-snippet_saver}
    # Only reachable from this machine (127.0.0.1). Host port defaults to 5433
    # so it doesn't clash with a local Postgres on 5432.
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5433}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    environment:
      DJANGO_DEBUG: ${DJANGO_DEBUG:-True}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-django-insecure-dev-only-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-snippet_saver}
      POSTGRES_USER: ${POSTGRES_USER:-snippet_saver}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-snippet_saver}
      # Inside the Compose network, Postgres is reached by service name on its own port.
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
    # Only reachable from this machine (127.0.0.1).
    ports:
      - '127.0.0.1:8000:8000'
    # Mount the source so code edits show up without rebuilding the image.
    volumes:
      - .:/app
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
